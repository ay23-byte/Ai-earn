name: Python tests

on:
  push:
    branches: ["main", "earn-os/**", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned development quality tools
        run: python -m pip install -r requirements-dev.txt

      - name: Static analysis gate (incremental scope)
        run: |
          python -m ruff check ai_earn tests tools
          python -m mypy
          python -m mypy --strict ai_earn/financial_math.py ai_earn/migrations ai_earn/postgres_adapter.py ai_earn/structured_logging.py ai_earn/connectors

      - name: Diagnose Windows test identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          whoami /user
          python -c "from ai_earn.windows_security import current_user_sid; print('Python token SID:', current_user_sid())"

      - name: Compile application and tests
        run: python -m compileall -q ai_earn tests tools

      - name: Security scan — secrets and DB exposure
        shell: bash
        run: |
          python -m tools.security_check
          if grep -R --include="*.py" -n "BEGIN PRIVATE KEY" ai_earn/; then
            echo "private key material found"
            exit 1
          fi
          if grep -R --include="*.py" -n -E "sk-[A-Za-z0-9]{20}" ai_earn/; then
            echo "possible API key found"
            exit 1
          fi
          if grep -R --include="*.js" --include="*.html" -n "0\.0\.0\.0" dashboard/; then
            echo "dashboard must not bind 0.0.0.0 — would expose local SQLite"
            exit 1
          fi
          git diff --check

      - name: Dependency security check (truthful audit, stdlib only)
        shell: bash
        run: |
          python -m tools.security_check --audit
          echo "dependency audit completed per tools/security_check.py (stdlib only -> clean; with deps -> pip-audit and fail on vulns per documented policy)"

      - name: Structured logging and health self-check
        shell: bash
        run: |
          python -c "from ai_earn.structured_logging import get_logger; l=get_logger(); l.info('health_check', message='CI health probe')"
          python -m ai_earn health --json || true
          python -m ai_earn doctor --json || true
          python -c "from ai_earn.production_config import production_summary; import json, os; print(json.dumps(production_summary(), indent=2))" || true

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee unittest.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "===== FAILED TEST LOG TAIL (last 300 lines) ====="
            tail -n 300 unittest.log || true
            echo "===== END TAIL ====="
          fi
          exit $status

      - name: Upload test log on failure
        if: failure() && hashFiles('unittest.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-${{ matrix.os }}-${{ matrix.python-version }}
          path: unittest.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Report failures to PR (bypass blob)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting CI failure context to PR..."
          if [ -f unittest.log ]; then
            TAIL=$(tail -n 500 unittest.log | head -c 7000)
            FAILS=$(grep -A 40 -E "^FAIL:|^ERROR:" unittest.log | head -n 700 | head -c 7000 || true)
            BODY="❌ CI failed on \`${{ matrix.os }} / ${{ matrix.python-version }}\`.
          Unit-test log tail:
          \`\`\`
          $TAIL
          \`\`\`
          Test failure excerpts:
          \`\`\`
          $FAILS
          \`\`\`"
          else
            BODY="❌ CI failed on \`${{ matrix.os }} / ${{ matrix.python-version }}\` before a unittest.log was produced. The unit-test step may not have started; inspect the failed workflow step above. This is not being reported as a unit-test failure."
          fi
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -f body="$BODY" || echo "comment failed"

      - name: Health and doctor (read-only, no DBs expected on runner)
        run: |
          python -m ai_earn health --json || true
          python -m ai_earn doctor --json || true
