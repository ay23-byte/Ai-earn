[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Initial gate for new modules; existing legacy modules are expanded into this
# gate incrementally rather than introducing a known-failing repository check.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ai_earn/financial_math.py", "ai_earn/migrations"]
show_error_codes = true
pretty = true
