[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["ai_earn"]
ignore_missing_imports = true
allow_untyped_defs = true
allow_incomplete_defs = true
check_untyped_defs = false
disable_error_code = "type-arg,no-untyped-call,no-untyped-def,no-any-return,empty-body"
show_error_codes = true
pretty = true
